<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<title>ModelView 3DS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div><b>ModelView 3DS</b><small id="status">Выберите ZIP с 3DS и текстурами</small></div>
  <label class="open">Открыть ZIP<input id="file" type="file" accept=".zip"></label>
</header>
<main>
  <div id="welcome">
    <div class="box">
      <div class="logo">◇</div>
      <h1>3DS просмотрщик</h1>
      <p>Загрузите ZIP с файлом <b>.3ds</b> и папкой текстур.</p>
      <button id="choose">Выбрать ZIP</button>
    </div>
  </div>
  <div id="viewer" class="hidden">
    <canvas id="canvas"></canvas>
    <div class="toolbar">
      <button id="fit">Вписать</button>
      <button id="solid" class="active">Текстуры</button>
      <button id="wire">Внешний каркас</button>
      <button id="reset">Сброс</button>
    </div>
    <div id="selection" class="selection hidden">
      <span id="selName">Деталь</span>
      <button id="hide">Скрыть</button>
      <button id="unselect">Отмена</button>
    </div>
    <aside>
      <div class="aside-head"><b>Детали</b><button id="showAll">Показать все</button></div>
      <div id="parts"></div>
      <p>Нажмите на деталь в модели, чтобы выбрать её. Скрытие действует только на выбранный объект.</p>
    </aside>
    <div class="help">1 палец — вращение · 2 пальца — масштаб/панорама</div>
  </div>
</main>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script type="module" src="app.js"></script>
</body></html>
